            -L"$VCPKG_INSTALLED_DIR/x64-linux/lib" -lbz2 -lz \
            -o "$RUNNER_TEMP/rnp-bridge-fault-injection"

      - name: Run controlled RNP fault-injection cleanup tests
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          F="$RUNNER_TEMP/fixtures"
          TRUSTED="$(cat "$F/trusted-primary.fingerprint")"
          "$RUNNER_TEMP/rnp-bridge-fault-injection" \
            "$F/trusted-keyring.gpg" "$F/valid-trusted.InRelease" \
            "$F/valid-subkey.InRelease" "$TRUSTED" | tee "$RUNNER_TEMP/fault-injection.out"
          grep -q '^decision=PASS' "$RUNNER_TEMP/fault-injection.out"
      - name: Compile and run repository Release metadata policy tests
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$RUNNER_TEMP/rnp-install/lib/pkgconfig:$VCPKG_INSTALLED_DIR/x64-linux/lib/pkgconfig"
          pkg-config --modversion botan-3
          clang -std=c11 -Wall -Wextra -Werror \
            -Iresearch/rnp-ios-spike/bridge \
            -I"$VCPKG_INSTALLED_DIR/x64-linux/include" \
            research/rnp-ios-spike/bridge/ORBITReleaseMetadata.c \
            research/rnp-ios-spike/harness/orbit-release-metadata-tests.c \
            $(pkg-config --static --libs botan-3) \
            -lstdc++ \
            -o "$RUNNER_TEMP/orbit-release-metadata-tests"
          "$RUNNER_TEMP/orbit-release-metadata-tests" | tee "$RUNNER_TEMP/release-metadata-policy.out"
          grep -q '^decision=PASS' "$RUNNER_TEMP/release-metadata-policy.out"

      - name: Compile and run repository key rotation trust tests
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$RUNNER_TEMP/rnp-install/lib/pkgconfig:$VCPKG_INSTALLED_DIR/x64-linux/lib/pkgconfig"
          clang -std=c11 -Wall -Wextra -Werror \
            -I"$RUNNER_TEMP/rnp-install/include" \
            -I"$VCPKG_INSTALLED_DIR/x64-linux/include" \
            -Iresearch/rnp-ios-spike/bridge \
            -c research/rnp-ios-spike/bridge/ORBITRNPInReleaseVerifier.c \
            -o "$RUNNER_TEMP/ORBITRNPInReleaseVerifier-rotation.o"
          clang -std=c11 -Wall -Wextra -Werror \
            -Iresearch/rnp-ios-spike/bridge \
            -c research/rnp-ios-spike/bridge/ORBITRNPTimePolicy.c \
            -o "$RUNNER_TEMP/ORBITRNPTimePolicy-rotation.o"
          clang -std=c11 -Wall -Wextra -Werror \
            -I"$VCPKG_INSTALLED_DIR/x64-linux/include" \
            -Iresearch/rnp-ios-spike/bridge \
            -c research/rnp-ios-spike/bridge/ORBITReleaseMetadata.c \
            -o "$RUNNER_TEMP/ORBITReleaseMetadata-rotation.o"
          clang -std=c11 -Wall -Wextra -Werror \
            -I"$RUNNER_TEMP/rnp-install/include" \
            -Iresearch/rnp-ios-spike/bridge \
            -c research/rnp-ios-spike/bridge/ORBITRepositoryTrust.c \
            -o "$RUNNER_TEMP/ORBITRepositoryTrust-rotation.o"
          clang -std=c11 -Wall -Wextra -Werror \
            -I"$RUNNER_TEMP/rnp-install/include" \
            -Iresearch/rnp-ios-spike/bridge \
            -c research/rnp-ios-spike/harness/orbit-trust-rotation-tests.c \
            -o "$RUNNER_TEMP/orbit-trust-rotation-tests.o"
          clang++ "$RUNNER_TEMP/orbit-trust-rotation-tests.o" \
            "$RUNNER_TEMP/ORBITRNPInReleaseVerifier-rotation.o" \
            "$RUNNER_TEMP/ORBITRNPTimePolicy-rotation.o" \
            "$RUNNER_TEMP/ORBITReleaseMetadata-rotation.o" \
            "$RUNNER_TEMP/ORBITRepositoryTrust-rotation.o" \
            $(pkg-config --static --libs librnp) \
            $(pkg-config --static --libs botan-3) \
            -L"$RUNNER_TEMP/rnp-install/lib" -lsexpp \
            $(pkg-config --static --libs json-c) \
            -L"$VCPKG_INSTALLED_DIR/x64-linux/lib" -lbz2 -lz -lstdc++ \
            -o "$RUNNER_TEMP/orbit-trust-rotation-tests"
          F="$RUNNER_TEMP/fixtures"
          "$RUNNER_TEMP/orbit-trust-rotation-tests" \
            "$F/trusted-keyring.gpg" "$F/valid-rotation.InRelease" \
            "$F/trusted-primary.fingerprint" "$F/other-keyring.gpg" \
            "$F/other-primary.fingerprint" "$F/trusted-keyring.gpg" \
            "$F/combined-keyring.gpg" "$F/unauthorized-rotation.InRelease" \
            "$F/expired-keyring.gpg" "$F/expired-primary.fingerprint" \
            "$F/revoked-keyring.gpg" "$F/revoked-primary.fingerprint" \
            "$F/recovery-keyring.gpg" "$F/recovery-primary.fingerprint" \
            "$F/valid-emergency-rotation.InRelease" "$F/emergency-activation.timestamp" \
            "$F/non-immediate-recovery.InRelease" \
            | tee "$RUNNER_TEMP/trust-rotation.out"
          grep -q '^decision=PASS' "$RUNNER_TEMP/trust-rotation.out"

      - name: Compile and run authenticated trust persistence tests
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$RUNNER_TEMP/rnp-install/lib/pkgconfig:$VCPKG_INSTALLED_DIR/x64-linux/lib/pkgconfig"
          clang -std=c11 -Wall -Wextra -Werror \
            -Iresearch/rnp-ios-spike/bridge \
            -c research/rnp-ios-spike/bridge/ORBITTrustPersistence.c \
            -o "$RUNNER_TEMP/ORBITTrustPersistence-tests.o"
          clang -std=c11 -Wall -Wextra -Werror \
            -Iresearch/rnp-ios-spike/bridge \
            -c research/rnp-ios-spike/harness/orbit-trust-persistence-tests.c \
            -o "$RUNNER_TEMP/orbit-trust-persistence-tests.o"
          clang++ -fsanitize=address,undefined -fno-omit-frame-pointer \
            "$RUNNER_TEMP/ORBITTrustPersistence-tests.o" \
            "$RUNNER_TEMP/orbit-trust-persistence-tests.o" \
            "$RUNNER_TEMP/ORBITRepositoryTrust-rotation.o" \
            "$RUNNER_TEMP/ORBITReleaseMetadata-rotation.o" \
            "$RUNNER_TEMP/ORBITRNPInReleaseVerifier-rotation.o" \
            "$RUNNER_TEMP/ORBITRNPTimePolicy-rotation.o" \
            $(pkg-config --static --libs librnp) \
            $(pkg-config --static --libs botan-3) \
            -L"$RUNNER_TEMP/rnp-install/lib" -lsexpp \
            $(pkg-config --static --libs json-c) \
            -L"$VCPKG_INSTALLED_DIR/x64-linux/lib" -lbz2 -lz -lstdc++ \
            -o "$RUNNER_TEMP/orbit-trust-persistence-tests"
          F="$RUNNER_TEMP/fixtures"
          "$RUNNER_TEMP/orbit-trust-persistence-tests" \
            "$F/trusted-primary.fingerprint" "$F/recovery-keyring.gpg" \
            "$F/recovery-primary.fingerprint" "$F/valid-emergency-rotation.InRelease" \
            "$F/other-keyring.gpg" "$F/other-primary.fingerprint" \
            "$F/emergency-activation.timestamp" \
            | tee "$RUNNER_TEMP/trust-persistence.out"
          grep -q '^decision=PASS' "$RUNNER_TEMP/trust-persistence.out"

      - name: Upload host verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnp-host-inrelease-verification
          path: |
            ${{ runner.temp }}/build-rnp-host/
            ${{ runner.temp }}/rnp-install/
            ${{ runner.temp }}/fixtures/
            ${{ runner.temp }}/*.out
          if-no-files-found: warn

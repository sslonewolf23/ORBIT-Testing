            -Wl,--wrap=rnp_op_verify_set_flags \
            -Wl,--wrap=rnp_op_verify_execute \
            -Wl,--wrap=rnp_op_verify_get_signature_count \
            -Wl,--wrap=rnp_op_verify_get_signature_at \
            -Wl,--wrap=rnp_op_verify_signature_get_status \
            -Wl,--wrap=rnp_op_verify_signature_get_handle \
            -Wl,--wrap=rnp_signature_is_valid \
            -Wl,--wrap=rnp_op_verify_signature_get_hash \
            -Wl,--wrap=rnp_op_verify_signature_get_times \
            -Wl,--wrap=rnp_op_verify_signature_get_key \
            -Wl,--wrap=rnp_key_get_fprint \
            -Wl,--wrap=rnp_key_get_alg \
